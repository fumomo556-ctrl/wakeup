  <title>修行台账</title>
  <style>
/* 修行台账 —— 日式简约 / 宋式素雅 · 手机竖屏优先 */

/* ---------- 字体嵌入：尾巴明朝 Shippori Mincho ---------- */
@font-face{
  font-family:'Shippori Mincho';
  src:url('fonts/ShipporiMincho-Regular.ttf') format('truetype');
  font-weight:400;font-style:normal;font-display:swap;
}
@font-face{
  font-family:'Shippori Mincho';
  src:url('fonts/ShipporiMincho-Medium.ttf') format('truetype');
  font-weight:500;font-style:normal;font-display:swap;
}
@font-face{
  font-family:'Shippori Mincho';
  src:url('fonts/ShipporiMincho-SemiBold.ttf') format('truetype');
  font-weight:600;font-style:normal;font-display:swap;
}
@font-face{
  font-family:'Shippori Mincho';
  src:url('fonts/ShipporiMincho-Bold.ttf') format('truetype');
  font-weight:700;font-style:normal;font-display:swap;
}
@font-face{
  font-family:'Shippori Mincho';
  src:url('fonts/ShipporiMincho-ExtraBold.ttf') format('truetype');
  font-weight:800;font-style:normal;font-display:swap;
}

:root{
  --paper:#FCFAF6;
  --paper-2:#FFFDF9;
  --card:#FFFFFF;
  --ink:#2E2A25;
  --ink-2:#575047;
  --ink-3:#82796E;
  --line:#E4DCCF;
  --line-2:#D2C8B8;
  --accent:#B4643C;
  --accent-2:#C99A6E;
  --wash:#F7EFE4;
  --blue:#4E86A0;
  --green:#5E8A5C;
  --danger:#B45344;
  --shadow:0 2px 10px rgba(46,42,37,.06);
  --shadow-sm:0 1px 4px rgba(46,42,37,.06);
  --r:8px;
  --r-sm:6px;
  --font:'Shippori Mincho',-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;padding:0;min-height:100%}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:var(--font);
  font-size:17px;
  line-height:1.85;
  font-weight:400;
  -webkit-font-smoothing:antialiased;
  -webkit-tap-highlight-color:transparent;
  padding-bottom:calc(78px + env(safe-area-inset-bottom));
}
h1,h2,h3,h4{font-family:var(--font);font-weight:700;margin:0;color:var(--ink);letter-spacing:.5px}
h1{font-size:25px;font-weight:700}
h2{font-size:22px}
h3{font-size:18px}
h4{font-size:15px}
p{margin:0}
.muted{color:var(--ink-3)}
.strong{font-weight:700}

.app-shell{max-width:720px;margin:0 auto;padding:0 18px}

/* ---------- 顶栏 / slogan ---------- */
.topbar{
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:calc(20px + env(safe-area-inset-top)) 2px 18px;
  border-bottom:1px solid var(--line);margin-bottom:8px;
}
.slogan{
  flex:1;min-width:0;text-align:center;font-size:23px;line-height:1.5;font-weight:600;
  color:var(--ink);outline:none;padding:8px;border-radius:var(--r-sm);
  border:1px solid transparent;transition:border-color .18s ease,background .18s ease;
  overflow-wrap:anywhere;letter-spacing:1px;
}
.slogan:focus{border-color:var(--line-2);background:var(--paper-2)}
.slogan:empty::before{content:attr(data-placeholder);color:var(--ink-3)}
.top-actions{display:flex;gap:8px;flex:none}
.round-btn{
  width:38px;height:38px;border-radius:50%;border:1px solid var(--line-2);
  background:var(--card);color:var(--ink-2);font-size:16px;font-weight:600;
  cursor:pointer;transition:background .15s ease,color .15s ease;
  font-family:var(--font);
}
.round-btn:hover{background:var(--wash);color:var(--ink)}
.round-btn:active{background:var(--line)}

/* ---------- 指令条 ---------- */
.cmd-wrap{margin:6px 0 20px}
.cmd-toggle{
  width:100%;display:flex;align-items:center;gap:8px;
  background:var(--card);border:1px solid var(--line);border-radius:var(--r-sm);
  padding:12px 14px;cursor:pointer;text-align:left;
  font-family:var(--font);font-size:14px;color:var(--ink-2);
  transition:border-color .15s ease;
}
.cmd-toggle:hover{border-color:var(--line-2)}
.cmd-spark{color:var(--accent);font-size:15px}
.cmd-label{font-weight:600;color:var(--ink);white-space:nowrap}
.cmd-preview{color:var(--ink-3);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.cmd-caret{color:var(--ink-3);transition:transform .2s ease}
.cmd-toggle[aria-expanded="true"] .cmd-caret{transform:rotate(180deg)}
.cmd-panel{
  margin-top:8px;background:var(--card);border:1px solid var(--line);
  border-radius:var(--r-sm);padding:14px;box-shadow:var(--shadow);
  animation:fadeIn .25s ease both;
}
.cmd-row{display:flex;gap:8px}
.cmd-row input{flex:1;min-width:0}
.cmd-hint{font-size:11px;color:var(--ink-3);margin-top:8px;line-height:1.6}

/* ---------- 主区 ---------- */
.main{min-width:0}
.main > *{animation:fadeIn .4s ease both}
.main > *:nth-child(2){animation-delay:.04s}
.main > *:nth-child(3){animation-delay:.08s}
.main > *:nth-child(4){animation-delay:.12s}
.main > *:nth-child(5){animation-delay:.16s}

.section-head{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin:36px 0 16px}
.section-head:first-child{margin-top:4px}
.section-head h2{color:var(--ink);font-size:21px}
.section-note{font-size:11px;color:var(--ink-3);text-align:right}
.view-head{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;margin-bottom:24px}
.view-head h2{color:var(--ink);font-size:25px;font-weight:700}
.view-head .sub{color:var(--ink-3);font-size:12px;margin-top:6px;line-height:1.6}
.head-actions{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end}

.panel{
  background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  padding:20px;box-shadow:var(--shadow-sm);margin-bottom:18px;
}
.empty{padding:28px 14px;text-align:center;color:var(--ink-3);font-size:13px}

/* ---------- 按钮 ---------- */
.btn{
  border:1px solid var(--line-2);border-radius:var(--r-sm);background:var(--card);
  padding:10px 16px;cursor:pointer;color:var(--ink-2);font-weight:600;font-size:14px;
  transition:background .15s ease,border-color .15s ease,color .15s ease;
  font-family:var(--font);
}
.btn:hover{background:var(--wash);border-color:var(--accent-2);color:var(--ink)}
.btn:active{background:var(--line)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:#9C5230;border-color:#9C5230;color:#fff}
.btn.small{padding:7px 12px;font-size:12px}
.btn.danger{background:var(--danger);border-color:var(--danger);color:#fff}
.btn.danger-ghost{color:var(--danger);border-color:#E5D2CD;background:#FCF7F5}
.btn.danger-ghost:hover{background:#F9EDEA;color:var(--danger);border-color:var(--danger)}
.link{
  background:transparent;border:0;padding:3px 0;margin-right:14px;
  color:var(--accent);cursor:pointer;font-size:13px;font-weight:600;
  font-family:var(--font);
}
.link:hover{color:var(--ink)}
.link.danger{color:var(--danger)}
.ops{white-space:nowrap}

/* ---------- 进度可视化 ---------- */
.progress-stack{display:flex;flex-direction:column;gap:16px}
.progress-card{
  display:flex;align-items:center;gap:20px;
  background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  padding:20px 22px;box-shadow:var(--shadow-sm);position:relative;
}
.ring{width:96px;height:96px;flex:none;position:relative;z-index:1}
.ring-track{fill:none;stroke:#E7DFD2;stroke-width:9}
.ring-fill{
  fill:none;stroke:var(--accent);stroke-width:9;stroke-linecap:round;
  transform:rotate(-90deg);transform-origin:60px 60px;
  transition:stroke-dashoffset .8s ease;
}
.progress-card:nth-child(2) .ring-fill{stroke:var(--blue)}
.progress-card:nth-child(3) .ring-fill{stroke:var(--green)}
.ring-num{font-family:var(--font);font-size:14px;font-weight:700;fill:var(--ink)}
.ring-cap{font-family:var(--font);font-size:9px;fill:var(--ink-3);letter-spacing:1px}
.progress-info{flex:1;min-width:0;position:relative;z-index:1}
.progress-title{font-family:var(--font);font-weight:700;font-size:17px;margin-bottom:10px;color:var(--ink)}
.bar{height:8px;background:#E7DFD2;border-radius:5px;overflow:hidden;position:relative}
.bar-fill{
  height:100%;background:var(--accent);border-radius:5px;
  transition:width .8s ease;position:relative;
}
.progress-card:nth-child(2) .bar-fill{background:var(--blue)}
.progress-card:nth-child(3) .bar-fill{background:var(--green)}
.progress-stats{
  display:grid;grid-template-columns:1fr 1fr;gap:5px 16px;margin-top:11px;
  font-size:12px;color:var(--ink-2);line-height:1.6;
}
.progress-stats b{color:var(--ink);font-weight:700}
.progress-stats .pct{color:var(--accent);font-weight:700;grid-column:1 / -1;font-size:13px}
.progress-extra{margin-top:8px;font-size:11px;color:var(--ink-3);line-height:1.6}
@keyframes softGlow{0%{background:var(--card)}40%{background:var(--wash)}100%{background:var(--card)}}
.progress-card.flash{animation:softGlow 1s ease}

/* ---------- 快捷入口 ---------- */
.quick-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:14px}
.quick-card{
  text-align:left;background:var(--card);border:1px solid var(--line);
  border-radius:var(--r);padding:18px;cursor:pointer;box-shadow:var(--shadow-sm);
  transition:border-color .15s ease,background .15s ease;font-family:var(--font);
}
.quick-card:hover{border-color:var(--accent-2);background:var(--paper-2)}
.qc-title{font-family:var(--font);font-weight:700;font-size:17px;color:var(--ink)}
.qc-desc{font-size:12px;color:var(--ink-2);margin:6px 0 12px;line-height:1.6;min-height:36px}
.qc-meta{font-size:11px;color:var(--ink-3);display:flex;justify-content:space-between;align-items:center;gap:6px}
.qc-arrow{color:var(--accent);font-size:14px}

/* ---------- 最近记录 ---------- */
.recent ul{list-style:none;margin:0;padding:0}
.recent li{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.recent li:last-child{border-bottom:0}
.tag{font-size:10px;color:var(--accent);background:var(--wash);border-radius:3px;padding:2px 8px;flex:none;font-weight:600}
.r-title{flex:1;color:var(--ink-2);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.r-date{color:var(--ink-3);font-size:11px;flex:none}

/* ---------- 备份卡片 ---------- */
.backup-card{background:var(--paper-2);border:1px solid var(--line-2);border-radius:var(--r);padding:18px;box-shadow:var(--shadow-sm)}
.backup-card h3{color:var(--ink);font-size:16px;margin-bottom:5px}
.backup-card p{font-size:12px;color:var(--ink-2);line-height:1.7;margin-bottom:14px}
.backup-actions{display:flex;gap:8px;flex-wrap:wrap}

/* ---------- 表格 ---------- */
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:left;padding:11px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-weight:700;color:var(--ink-2);background:var(--paper-2);white-space:nowrap;font-size:12px}
tbody tr:last-child td{border-bottom:0}
td.note{color:var(--ink-2);line-height:1.65;word-break:break-word}
.table-scroll{overflow-x:auto}
.cat-group{font-size:10px;color:var(--ink-3);display:block;margin-top:2px}
.pill{font-size:11px;border-radius:3px;padding:2px 9px;border:1px solid var(--line-2);color:var(--ink-2);white-space:nowrap;font-weight:600;display:inline-block}
.pill.reading{color:var(--blue);border-color:#B9D2DE;background:#EDF5F9}
.pill.done{color:var(--green);border-color:#C2D8BF;background:#F0F7EF}
.pill.todo{color:var(--ink-2);background:var(--paper-2)}
.finished{text-decoration:line-through;color:var(--ink-3)}

/* ---------- 筛选 / 表单控件 ---------- */
.filters{display:flex;flex-wrap:wrap;align-items:flex-end;gap:12px;margin-bottom:16px;padding-bottom:16px;border-bottom:1px solid var(--line)}
.filters label{font-size:11px;color:var(--ink-2);display:flex;flex-direction:column;gap:5px;flex:1;min-width:120px}
input,select,textarea{
  border:1px solid var(--line-2);background:#fff;border-radius:var(--r-sm);
  padding:11px 12px;outline:none;font-size:16px!important;color:var(--ink);
  font-family:var(--font);width:100%;font-weight:400;
}
input:focus,select:focus,textarea:focus{border-color:var(--accent-2)}
textarea{resize:vertical;line-height:1.7;min-height:80px}
.filters input,.filters select{min-width:0}
.inline-form{display:flex;align-items:flex-end;gap:8px;margin-top:12px;flex-wrap:wrap}
.inline-form label{font-size:11px;color:var(--ink-2);display:flex;flex-direction:column;gap:5px;flex:1;min-width:160px}
.stat-strip{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:0 0 18px}
.stat-strip>div{background:var(--paper-2);border:1px solid var(--line);border-radius:var(--r-sm);padding:12px 14px}
.stat-strip span{display:block;font-size:11px;color:var(--ink-3)}
.stat-strip b{display:block;font-family:var(--font);font-size:18px;color:var(--ink);font-weight:700;margin-top:2px}

/* ---------- 加行分项：大字进度卡片 ---------- */
.cat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px}
.cat-card{
  background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  padding:22px 18px 16px;box-shadow:var(--shadow-sm);
  display:flex;flex-direction:column;align-items:center;text-align:center;gap:5px;
}
.cat-name{font-size:13px;color:var(--ink-2);font-weight:400;line-height:1.5}
.cat-big{
  font-family:var(--font);font-size:38px;line-height:1.2;font-weight:700;color:var(--ink);
  letter-spacing:.5px;margin:4px 0;font-variant-numeric:tabular-nums;
}
.cat-slash{color:var(--ink-3);font-weight:400;margin:0 3px;font-size:28px}
.cat-remain{font-size:12px;color:var(--ink-3);margin-bottom:6px}
.cat-card .bar-slim{width:100%;height:6px}
.cat-ops{display:flex;gap:16px;justify-content:center;width:100%;margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}
.cat-ops .link{margin:0}

/* ---------- 念诵：项目卡片 ---------- */
.rec-project{padding:16px 18px}
.rec-project-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;padding-bottom:10px;border-bottom:1px solid var(--line)}
.rec-project-head .cat-ops{margin:0;padding:0;border:0;width:auto;flex:none}
.rec-project-kind,.rec-locked{font-size:11px;color:var(--ink-3)}
.rec-project .progress-card{border:0;box-shadow:none;background:transparent;padding:0}
.rec-project .ring{width:82px;height:82px}
.rec-project .ring-fill{stroke:var(--accent)}
.rec-project .bar-fill{background:var(--accent)}

/* ---------- 精简卡片列表 + 详情 ---------- */
.item-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.item-card{
  display:flex;flex-direction:column;align-items:stretch;gap:10px;text-align:left;
  background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  padding:20px;min-height:106px;cursor:pointer;box-shadow:var(--shadow-sm);
  transition:border-color .15s ease,background .15s ease;font-family:var(--font);
}
.item-card:hover{border-color:var(--accent-2);background:var(--paper-2)}
.item-title{font-family:var(--font);font-size:17px;font-weight:600;color:var(--ink);line-height:1.55;overflow-wrap:anywhere}
.item-card.is-done .item-title{text-decoration:line-through;color:var(--ink-3)}
.quote-card .item-title{font-size:15px;line-height:1.65;font-weight:400}
.item-foot{display:flex;align-items:center;gap:8px;margin-top:auto;flex-wrap:wrap}
.item-sub{font-size:11px;color:var(--ink-3)}
.item-more{font-size:11px;color:var(--accent);margin-left:auto;white-space:nowrap}
.detail-list{display:flex;flex-direction:column;gap:14px}
.detail-row{display:flex;flex-direction:column;gap:3px;padding-bottom:12px;border-bottom:1px solid var(--line)}
.detail-row:last-child{border-bottom:0;padding-bottom:0}
.detail-k{font-size:11px;color:var(--ink-3);letter-spacing:.5px}
.detail-v{font-size:15px;color:var(--ink);line-height:1.75;overflow-wrap:anywhere;white-space:normal}

/* ---------- 批量录入 ---------- */
.batch-preview{margin-top:16px;padding:16px;background:var(--paper-2);border:1px solid var(--line);border-radius:var(--r-sm);max-height:240px;overflow:auto}
.batch-count{font-size:12px;color:var(--ink-2);margin-bottom:8px}
.batch-count b{color:var(--accent);font-size:15px}
.batch-list{margin:0;padding-left:20px;font-size:13px;color:var(--ink);line-height:1.8}
.batch-list li{overflow-wrap:anywhere}

/* ---------- 法语集筛选 ---------- */
.quote-filters{align-items:flex-end}
.quote-filters label.grow{flex:2;min-width:160px}
.quote-filters input,.quote-filters select{font-size:16px!important}

/* ---------- 弹窗 ---------- */
.modal-overlay{
  position:fixed;inset:0;background:rgba(58,53,46,.34);
  display:flex;align-items:center;justify-content:center;padding:16px;z-index:60;
  animation:fadeIn .18s ease both;
}
.modal{
  background:var(--paper-2);border:1px solid var(--line-2);border-radius:var(--r);
  width:100%;max-width:540px;max-height:90vh;overflow:auto;
  box-shadow:0 12px 40px rgba(58,53,46,.14);animation:fadeIn .22s ease both;
}
.modal.wide{max-width:680px}
.modal-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:18px 20px;border-bottom:1px solid var(--line);background:var(--paper-2)}
.modal-head h3{color:var(--ink)}
.modal-body{padding:20px}
.modal-body.grid{display:grid;grid-template-columns:1fr;gap:16px}
.modal-foot{display:flex;justify-content:flex-end;gap:8px;padding:14px 20px;border-top:1px solid var(--line);background:var(--paper-2)}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label{font-size:12px;color:var(--ink-2);font-weight:600}
.field .hint{font-size:11px;color:var(--ink-3);line-height:1.6}
.icon-btn{background:transparent;border:0;font-size:24px;color:var(--ink-3);cursor:pointer;line-height:1;font-family:var(--font)}
.confirm-msg{color:var(--ink-2);line-height:1.8;font-size:14px}
.confirm-tip{margin-top:12px;font-size:12px;color:var(--danger)}
#confirm-input{margin-top:10px}
.data-actions{display:flex;flex-direction:column;gap:10px;margin-top:16px}
.help-list{padding-left:20px;color:var(--ink-2);font-size:13px}
.help-list li{margin:6px 0;line-height:1.7}
.help-block{margin-bottom:16px}
.help-block h4{color:var(--ink);margin-bottom:6px}

/* ---------- 底部标签栏 ---------- */
.tabbar{
  position:fixed;left:0;right:0;bottom:0;z-index:45;
  display:flex;align-items:stretch;
  background:rgba(252,251,247,.97);border-top:1px solid var(--line);
  padding:6px 3px calc(6px + env(safe-area-inset-bottom));
  backdrop-filter:blur(8px);
}
.nav-item{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  background:transparent;border:0;border-radius:var(--r-sm);padding:4px 1px;
  color:var(--ink-3);font-size:11px;font-weight:400;cursor:pointer;
  font-family:var(--font);min-width:0;transition:color .16s ease;
  white-space:nowrap;
}
.nav-ico{font-size:18px;line-height:1.2;transition:transform .16s ease}
.nav-item.active{color:var(--accent);font-weight:700}
.nav-item.active .nav-ico{transform:translateY(-1px)}
.nav-item:active{color:var(--ink)}

/* ---------- 提示条 ---------- */
#toast-root{position:fixed;left:0;right:0;bottom:calc(84px + env(safe-area-inset-bottom));z-index:80;display:flex;flex-direction:column;align-items:center;gap:7px;pointer-events:none;padding:0 16px}
.toast{
  background:var(--card);border:1px solid var(--line);border-left:2px solid var(--accent);
  border-radius:var(--r-sm);padding:10px 16px;box-shadow:var(--shadow);color:var(--ink);font-size:13px;
  font-weight:600;animation:fadeIn .25s ease both;max-width:100%;text-align:center;
}

/* ---------- 轻量动效 ---------- */
@keyframes fadeIn{from{opacity:0}to{opacity:1}}

/* ---------- 手机竖屏：表格转卡片，杜绝横向滚动 ---------- */
@media(max-width:640px){
  .app-shell{padding:0 14px}
  .view-head{flex-direction:column;align-items:stretch}
  .head-actions{justify-content:flex-start}
  .head-actions .btn{flex:1;text-align:center}
  .table-scroll{overflow:visible}
  table,tbody,tr,td{display:block;width:100%}
  thead{display:none}
  tr{
    background:var(--card);border:1px solid var(--line);border-radius:var(--r-sm);
    padding:12px 14px;margin-bottom:11px;box-shadow:var(--shadow-sm);
  }
  td{border:0;padding:5px 0;display:flex;gap:10px;justify-content:space-between;align-items:flex-start;font-size:13px;text-align:right;line-height:1.6}
  td::before{content:attr(data-label);color:var(--ink-3);font-size:11px;flex:none;text-align:left;padding-top:1px}
  td.ops{justify-content:flex-start;gap:16px;padding-top:9px;margin-top:6px;border-top:1px solid var(--line)}
  td.ops::before{margin-right:auto}
  td.note{max-width:none;white-space:normal}
  .recent li{align-items:flex-start}
  .r-title{white-space:normal}
  .modal-overlay{align-items:flex-end;padding:0}
  .modal{
    max-width:none;border-radius:12px 12px 0 0;border-bottom:0;max-height:94vh;
    padding-bottom:env(safe-area-inset-bottom);animation:fadeIn .25s ease both;
  }
  .modal-foot{position:sticky;bottom:0}
  .modal-foot .btn{flex:1;text-align:center}
  .data-actions .btn{width:100%}
  .quick-grid{grid-template-columns:1fr 1fr;gap:11px}
  .qc-desc{min-height:0}
  .progress-card{gap:12px;padding:16px}
  .ring{width:82px;height:82px}
  .progress-stats{grid-template-columns:1fr 1fr;font-size:11px}
  .stat-strip{grid-template-columns:1fr 1fr}
  .slogan{font-size:19px}
  .cat-grid{grid-template-columns:1fr 1fr;gap:11px}
  .cat-big{font-size:32px}
  .cat-card{padding:18px 12px 14px}
  .rec-project{padding:14px 12px}
  .rec-project .ring{width:72px;height:72px}
  .rec-project .progress-card{gap:10px}
  .rec-project-head{flex-wrap:wrap}
  .item-grid{grid-template-columns:1fr;gap:11px}
  .item-card{min-height:90px;padding:18px}
  .view-head h2{font-size:21px}
  .detail-v{font-size:15px}
}

@media(max-width:360px){
  .quick-grid{grid-template-columns:1fr}
  .nav-item{font-size:9px}
  .nav-ico{font-size:16px}
  .cat-grid{grid-template-columns:1fr}
}

@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}

  <script>
/* 藏传佛法个人修行台账 —— 逻辑层（纯本地，无依赖） */
(function(){
'use strict';

var STORAGE_KEY='dharma_ledger_v1';
var PRACTICE_GOAL=2258;
var MANTRA_GOAL=100000000;
var LEGACY_RECITATION_ID='recitation-guanyin';
var IDB_NAME='dharma_ledger_v1', IDB_STORE='kv', IDB_KEY='state';
var DATA_ARRAYS=['practices','categories','mantras','books','empowerments','transmissions','quotes','recitationProjects'];
var $=function(s,r){return (r||document).querySelector(s)};
var $$=function(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s))};

/* ---------- 预置前行功课清单（内置，无需手动新增） ---------- */
var PRESET_CATEGORIES=[
  {id:'preset-wai',      name:'共同外前行',          target:98,  group:'',           note:'',preset:true},
  {id:'preset-guiyi',    name:'皈依与大礼拜',        target:360, group:'不共内前行', note:'',preset:true},
  {id:'preset-bodhi',    name:'发菩提心',            target:360, group:'不共内前行', note:'',preset:true},
  {id:'preset-vajra-out',name:'金刚萨埵（外）',      target:300, group:'不共内前行', note:'',preset:true},
  {id:'preset-vajra-in', name:'金刚萨埵（内）',      target:60,  group:'不共内前行', note:'',preset:true},
  {id:'preset-mandala',  name:'供曼达',              target:300, group:'不共内前行', note:'',preset:true},
  {id:'preset-gusali',   name:'古萨里',              target:60,  group:'不共内前行', note:'',preset:true},
  {id:'preset-guru-7',   name:'上师瑜伽：七句祈请文', target:120, group:'不共内前行', note:'',preset:true},
  {id:'preset-guru-7b',  name:'上师瑜伽：七支供',    target:120, group:'不共内前行', note:'',preset:true},
  {id:'preset-guru-pray',name:'上师瑜伽：祈请文',    target:120, group:'不共内前行', note:'',preset:true},
  {id:'preset-guru-mantra',name:'上师瑜伽：心咒',    target:300, group:'不共内前行', note:'',preset:true},
  {id:'preset-guru-emp', name:'上师瑜伽：灌顶',      target:60,  group:'不共内前行', note:'',preset:true}
];
function presetCategories(){
  return PRESET_CATEGORIES.map(function(c){return Object.assign({},c)});
}

/* ---------- 念诵项目：默认迁移项（只读保护旧月份记录） ---------- */
function defaultRecitationProject(){
  return {id:LEGACY_RECITATION_ID,name:'观音心咒',target:MANTRA_GOAL,unit:'遍',base:0,legacy:true};
}
function ensureRecitationProjects(s){
  if(!Array.isArray(s.recitationProjects)) s.recitationProjects=[];
  if(!s.recitationProjects.some(function(p){return p&&p.id===LEGACY_RECITATION_ID})){
    s.recitationProjects.unshift(defaultRecitationProject());
  }
  return s;
}

function defaultState(){
  return {
    practices:[], categories:presetCategories(), mantras:[], books:[],
    empowerments:[], transmissions:[], quotes:[], recitationProjects:[defaultRecitationProject()],
    settings:{practiceGoal:PRACTICE_GOAL,mantraGoal:MANTRA_GOAL,mantraTargetDate:'',slogan:'',_rev:0}
  };
}
function ensurePresets(s){
  if(!Array.isArray(s.categories)||s.categories.length===0) s.categories=presetCategories();
  s.settings=s.settings&&typeof s.settings==='object'?s.settings:{};
  s.settings.practiceGoal=PRACTICE_GOAL;
  if(!(Number(s.settings.mantraGoal)>0)) s.settings.mantraGoal=MANTRA_GOAL;
  if(typeof s.settings.slogan!=='string') s.settings.slogan='';
  return s;
}
function normalizeState(d){
  if(!d||typeof d!=='object') return defaultState();
  var base=defaultState();
  DATA_ARRAYS.forEach(function(k){ base[k]=Array.isArray(d[k])?d[k]:[] });
  base.settings=Object.assign(base.settings,d.settings||{});
  return ensureRecitationProjects(ensurePresets(base));
}
function loadState(){
  try{
    var raw=localStorage.getItem(STORAGE_KEY);
    if(!raw) return defaultState();
    return normalizeState(JSON.parse(raw));
  }catch(e){
    try{console.warn('读取本地数据失败，已使用默认值',e)}catch(_){}
    return defaultState();
  }
}

var state=loadState();

/* ---------- 存储：IndexedDB 为主，localStorage 兜底 ----------
   localStorage 同步读写保证首屏无闪烁、刷新不丢；
   每次保存同步镜像写入 IndexedDB；启动时异步读取 IndexedDB，
   以 settings._rev 判断新旧，取更新的那份并回写两端，任一存储异常都不影响使用。 */
function idbAvailable(){
  try{ return typeof indexedDB!=='undefined' && !!indexedDB }catch(e){ return false }
}
function idbWrite(snap){
  if(!idbAvailable())return;
  try{
    var req=indexedDB.open(IDB_NAME,1);
    req.onupgradeneeded=function(){
      try{ var db=req.result; if(!db.objectStoreNames.contains(IDB_STORE)) db.createObjectStore(IDB_STORE) }catch(e){}
    };
    req.onsuccess=function(){
      var db=req.result;
      try{ var tx=db.transaction(IDB_STORE,'readwrite'); tx.objectStore(IDB_STORE).put(snap,IDB_KEY) }catch(e){}
      try{ db.close() }catch(e){}
    };
    req.onerror=function(){};
  }catch(e){}
}
function snapshot(){ try{ return JSON.parse(JSON.stringify(state)) }catch(e){ return null } }
function save(){
  try{ state.settings._rev=safeNum(state.settings._rev)+1 }catch(e){}
  try{ localStorage.setItem(STORAGE_KEY,JSON.stringify(state)) }
  catch(e){ try{toast('本地存储写入失败，请导出备份后检查浏览器设置')}catch(_){} }
  var snap=snapshot(); if(snap) idbWrite(snap);
}
function initIDB(){
  if(!idbAvailable())return;
  try{
    var req=indexedDB.open(IDB_NAME,1);
    req.onupgradeneeded=function(){
      try{ var db=req.result; if(!db.objectStoreNames.contains(IDB_STORE)) db.createObjectStore(IDB_STORE) }catch(e){}
    };
    req.onerror=function(){};
    req.onsuccess=function(){
      var db=req.result;
      try{
        var tx=db.transaction(IDB_STORE,'readonly');
        var rq=tx.objectStore(IDB_STORE).get(IDB_KEY);
        rq.onsuccess=function(){
          try{
            var d=rq.result;
            if(d&&typeof d==='object'){
              var idbState=normalizeState(d);
              var localRev=safeNum(state.settings._rev), idbRev=safeNum(idbState.settings._rev);
              if(idbRev>localRev){
                state=idbState; applySlogan(); render();
                try{ localStorage.setItem(STORAGE_KEY,JSON.stringify(state)) }catch(e){}
              }else if(idbRev<localRev){
                var s2=snapshot(); if(s2) idbWrite(s2);
              }
            }else{
              var s3=snapshot(); if(s3) idbWrite(s3);
            }
          }catch(e){}
          try{ db.close() }catch(e){}
        };
        rq.onerror=function(){ try{db.close()}catch(e){} };
      }catch(e){ try{db.close()}catch(_){} }
    };
  }catch(e){}
}

/* ---------- 工具（全部带数值兜底，避免 NaN / undefined 中断渲染） ---------- */
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8)}
function safeNum(n){ n=Number(n); return isFinite(n)?n:0 }
function esc(s){
  return String(s==null?'':s).replace(/[&<>"']/g,function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}
function nl2br(s){return esc(s).replace(/\n/g,'<br>')}
function today(){
  var d=new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function curMonth(){return today().slice(0,7)}
function fmt(n,dec){
  dec=dec||0;
  return safeNum(n).toLocaleString('zh-CN',{minimumFractionDigits:dec,maximumFractionDigits:dec});
}
function trimZeros(s){return s.indexOf('.')>=0?s.replace(/0+$/,'').replace(/\.$/,''):s}
function fmtSmart(n,dec){
  var s=fmt(n,dec===undefined?1:dec);
  return s.indexOf('.')>=0?trimZeros(s):s;
}
function fmtPct(v){
  v=safeNum(v);
  if(v<=0) return '0%';
  if(v>=1) return trimZeros(v.toFixed(2))+'%';
  if(v>=0.01) return trimZeros(v.toFixed(4))+'%';
  return '<0.01%';
}
function pct(cur,total){
  total=safeNum(total);
  if(total<=0) return 0;
  return Math.min(100,Math.max(0,safeNum(cur)/total*100));
}
function find(arr,id){
  if(!Array.isArray(arr))return null;
  for(var i=0;i<arr.length;i++){if(arr[i]&&arr[i].id===id)return arr[i]}
  return null;
}
function hoursOf(p){
  if(!p)return 0;
  return Math.max(0,safeNum(p.hours))+Math.max(0,safeNum(p.minutes))/60;
}
function practiceTotal(){ return state.practices.reduce(function(s,p){return s+hoursOf(p)},0) }
function categoryHours(name){ return state.practices.reduce(function(s,p){return s+(p&&p.name===name?hoursOf(p):0)},0) }
function mantraTotal(){ return state.mantras.reduce(function(s,m){return s+Math.max(0,safeNum(m&&m.count))},0) }
function mantraRows(){
  var rows=state.mantras.slice().sort(function(a,b){
    return String(a&&a.month||'').localeCompare(String(b&&b.month||''))||String((a&&a.createdAt)||'').localeCompare(String((b&&b.createdAt)||''));
  });
  var acc=0;
  return rows.map(function(m){
    acc+=Math.max(0,safeNum(m&&m.count));
    return Object.assign({},m,{cumulative:acc});
  });
}
/* 旧记录没有 projectId：自动归属默认「观音心咒」项目，不改写原记录、不重复计数 */
function legacyRecitationProject(){
  return find(state.recitationProjects,LEGACY_RECITATION_ID)||defaultRecitationProject();
}
function projectOfRecord(r){
  if(!r)return null;
  if(!r.projectId||r.projectId===LEGACY_RECITATION_ID)return legacyRecitationProject();
  return find(state.recitationProjects,r.projectId)||null;
}
function projectRecords(p){
  if(!p)return [];
  return state.mantras.filter(function(r){
    if(!r)return false;
    if(p.id===LEGACY_RECITATION_ID) return !r.projectId||r.projectId===LEGACY_RECITATION_ID;
    return r.projectId===p.id;
  });
}
function recitationTotal(p){
  if(!p)return 0;
  var counted=projectRecords(p).reduce(function(s,r){return s+Math.max(0,safeNum(r&&r.count))},0);
  return Math.max(0,safeNum(p.base))+counted;
}
function fmtHours(p){
  var h=Math.max(0,safeNum(p&&p.hours)),m=Math.max(0,safeNum(p&&p.minutes)),s='';
  if(h)s+=h+' 小时';
  if(m)s+=(s?' ':'')+m+' 分钟';
  return s||'0 分钟';
}
function pill(status){
  var cls=status==='已读完'?'done':(status==='在读'?'reading':'todo');
  return '<span class="pill '+cls+'">'+esc(status||'待读')+'</span>';
}

function ringSvg(p,label){
  p=Math.min(100,Math.max(0,safeNum(p)));
  var R=52,C=2*Math.PI*R,off=C*(1-p/100);
  return '<svg class="ring" viewBox="0 0 120 120" aria-label="'+esc(label)+' '+fmtPct(p)+'">'+
    '<circle class="ring-track" cx="60" cy="60" r="52"></circle>'+
    '<circle class="ring-fill" cx="60" cy="60" r="52" stroke-dasharray="'+C.toFixed(2)+'" stroke-dashoffset="'+off.toFixed(2)+'"></circle>'+
    '<text class="ring-num" x="60" y="59" text-anchor="middle">'+fmtPct(p)+'</text>'+
    '<text class="ring-cap" x="60" y="76" text-anchor="middle">完成</text></svg>';
}
function progressWidget(cfg){

function flashProgress(){

function animateNumbers(root){
  var reduce=false;
  try{reduce=!!(window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches)}catch(_){}
  if(reduce||typeof window.requestAnimationFrame!=='function')return;
  $$('.anim-num',root||document).forEach(function(el){
    var to=Number(el.getAttribute('data-val'));
    if(!isFinite(to))return;
    var dec=Number(el.getAttribute('data-dec')||0),start=null,dur=760;
    function frame(ts){
      if(start===null)start=ts;
      var t=Math.min(1,(ts-start)/dur),e=1-Math.pow(1-t,3);
      el.textContent=fmt(to*e,dec);
      if(t<1)window.requestAnimationFrame(frame);
      else el.textContent=fmt(to,dec);
    }
    window.requestAnimationFrame(frame);
  });
}

function safeFieldValue(v){

function fieldHtml(f){
  var v=safeFieldValue(f.value), full=f.full?' full':'';

  var input='';
  if(f.type==='select'){
    input='<select id="fld-'+f.name+'" name="'+f.name+'">'+(f.options||[]).map(function(o){
      return '<option value="'+esc(o.value)+'" '+(String(o.value)===String(v)?'selected':'')+'>'+esc(o.label)+'</option>';

  }else{

      (f.step!==undefined?' step="'+f.step+'"':'')+extra+' placeholder="'+esc(f.placeholder||'')+'" autocomplete="off" enterkeyhint="done">';
  }

function renderRecitations(){
  var legacy=legacyRecitationProject();
  var legacyRecords=projectRecords(legacy), legacyTotal=recitationTotal(legacy);
  var goal=safeNum(legacy.target)||MANTRA_GOAL, unit=legacy.unit||'遍';
  var months={};legacyRecords.forEach(function(m){if(m&&m.month)months[m.month]=1});
  var monthCount=Object.keys(months).length;
  var avg=monthCount?legacyTotal/monthCount:0,remain=Math.max(0,goal-legacyTotal);
  var need=null,monthsLeft=null;
  if(state.settings.mantraTargetDate){
    var t=new Date(state.settings.mantraTargetDate+'T23:59:59');
    if(!isNaN(t.getTime())){
      monthsLeft=Math.max(1,Math.ceil((t-new Date())/(1000*60*60*24*30.44)));
      need=remain/monthsLeft;
    }
  }
  var extra='已记录 '+monthCount+' 个月 · 月均上报 <b>'+fmt(Math.round(avg))+'</b> '+unit+' · 剩余 <b>'+fmt(remain)+'</b> '+unit+
    (need!==null?' · 距目标日期约 '+monthsLeft+' 个月，需月均 <b>'+fmt(Math.round(need))+'</b> '+unit:'');

  var projectCards=state.recitationProjects.map(function(p){

    '</div>';
  }).join('');

  var allRows=state.mantras.slice().sort(function(a,b){
    return String(b&&b.date||b&&b.month||'').localeCompare(String(a&&a.date||a&&a.month||''))||String((b&&b.createdAt)||'').localeCompare(String((a&&a.createdAt)||''));

    rows.map(function(m){
      var p=projectOfRecord(m), pu=p&&p.unit||'遍';
      return '<tr><td data-label="念诵项目" class="strong">'+esc(p&&p.name||'念诵')+'</td>'+
        '<td data-label="方式">'+(m&&m.mode==='once'?'按次':'按月')+'</td>'+
        '<td data-label="时间">'+esc(m&&m.date||m&&m.month||'—')+'</td>'+
        '<td data-label="数量">'+fmt(m&&m.count)+' '+esc(pu)+'</td>'+
        '<td class="note" data-label="备注">'+(m&&m.note?nl2br(m.note):'<span class="muted">—</span>')+'</td>'+
        '<td class="ops" data-label="操作"><button type="button" class="link" data-action="edit-rec" data-id="'+esc(m.id)+'">编辑</button>'+
        '<button type="button" class="link danger" data-action="del-rec" data-id="'+esc(m.id)+'">删除</button></td></tr>';
    }).join('')+'</tbody></table></div>':
    '<div class="empty">尚未录入念诵记录。点击「上报念诵」开始。</div>';
  var filterOpts=state.recitationProjects.map(function(p){
    return '<option value="'+esc(p.id)+'" '+(ui.recitationProject===p.id?'selected':'')+'>'+esc(p.name)+'</option>';
  }).join('');

  return '<div class="view-head"><div><h2>念诵</h2>'+
      '<p class="sub">按次或按月上报 · 各项目目标、单位与进度独立统计 · 统计参考，不作评判</p></div>'+
      '<div class="head-actions"><button type="button" class="btn" data-action="add-rec-project">+ 新增项目</button>'+
      '<button type="button" class="btn primary" data-action="add-rec">+ 上报念诵</button></div></div>'+
    '<div class="section-head"><h3>念诵项目进度</h3><span class="section-note">点击项目卡片右上角可编辑</span></div>'+
    (projectCards||'<div class="empty">暂无念诵项目，点击「新增项目」开始。</div>')+
    '<div class="section-head"><h3>观音心咒统计</h3><span class="section-note">默认项目 · 历史月记录原样保留</span></div>'+
    progressWidget({title:'观音心咒总进度',current:legacyTotal,total:goal,unit:unit,extra:extra})+
    '<div class="panel stat-strip">'+
      '<div><span>已念数量</span><b>'+fmt(legacyTotal)+'</b></div>'+
      '<div><span>剩余数量</span><b>'+fmt(remain)+'</b></div>'+
      '<div><span>记录月数</span><b>'+monthCount+'</b></div>'+
      '<div><span>月均上报</span><b>'+fmt(Math.round(avg))+'</b></div>'+
      (need!==null?'<div><span>需月均（至目标日期）</span><b>'+fmt(Math.round(need))+'</b></div>':'')+
    '</div>'+
    '<div class="panel"><div class="inline-form">'+
      '<label>目标完成日期（可选，仅用于统计参考）<input type="date" id="target-date" value="'+esc(state.settings.mantraTargetDate)+'"></label>'+
      '<button type="button" class="btn small" data-action="set-target-date">保存</button>'+
    '</div></div>'+
    '<div class="section-head"><h3>上报记录</h3><span class="section-note">按时间倒序 · 可编辑、删除</span></div>'+
    '<div class="panel"><div class="filters">'+
      '<label>念诵项目<select id="rec-project-filter"><option value="">全部项目</option>'+filterOpts+'</select></label>'+

/* ---------- 法语集 ---------- */
function quoteFiltered(){
  var kw=String(ui.quoteKw||'').trim().toLowerCase(), tag=String(ui.quoteTag||'');
  var rows=state.quotes.slice().sort(function(a,b){
    return String(b&&b.date||'').localeCompare(String(a&&a.date||''))||String((b&&b.createdAt)||'').localeCompare(String((a&&a.createdAt)||''));
  });
  return rows.filter(function(q){
    if(!q)return false;
    if(tag&&String(q.tag||'').indexOf(tag)<0)return false;
    if(kw){
      var hay=(String(q.text||q.quote||'')+' '+String(q.source||'')).toLowerCase();
      if(hay.indexOf(kw)<0)return false;
    }
    return true;
  });
}
function quoteListHtml(rows){
  if(!rows.length) return '<div class="empty">没有符合条件的法语记录。</div>';
  return '<div class="item-grid">'+rows.map(function(q){
    var txt=String(q.text||q.quote||'').replace(/\s+/g,' ').trim();
    var brief=txt.length>52?txt.slice(0,52)+'…':txt;
    return itemCard('detail-quote',q.id,brief,q.tag?'<span class="pill todo">'+esc(q.tag)+'</span>':'','quote-card');
  }).join('')+'</div>';
}
function renderQuotes(){
  var tags={};
  state.quotes.forEach(function(q){
    var t=String(q&&q.tag||'').trim();
    if(t) t.split(/[、,，]/).forEach(function(x){x=x.trim();if(x)tags[x]=1});
  });
  var tagList=Object.keys(tags).sort();
  return '<div class="view-head"><div><h2>法语集</h2>'+
      '<p class="sub">随手记下读到的法语、教言与开示要点 · 点开卡片查看与编辑</p></div>'+
      '<div class="head-actions"><button type="button" class="btn primary" data-action="add-quote">+ 新增法语</button></div></div>'+
    '<div class="panel filters quote-filters">'+
      '<label class="grow">搜索正文 / 出处<input type="search" id="q-search" value="'+esc(ui.quoteKw)+'" placeholder="输入关键词" autocomplete="off"></label>'+
      '<label>标签<select id="q-tag"><option value="">全部标签</option>'+tagList.map(function(t){
        return '<option value="'+esc(t)+'" '+(ui.quoteTag===t?'selected':'')+'>'+esc(t)+'</option>';
      }).join('')+'</select></label>'+
    '</div>'+
    '<div id="quote-list">'+quoteListHtml(quoteFiltered())+'</div>';
}

var VIEWS={overview:renderOverview,practices:renderPractices,mantras:renderRecitations,books:renderBooks,empowerments:renderEmpowerments,transmissions:renderTransmissions,quotes:renderQuotes};
function render(){
  try{
    var view=VIEWS[currentView]||renderOverview;
    $('#main').innerHTML=view();
    animateNumbers($('#main'));
    bindViewEvents();
    $$('.nav-item').forEach(function(b){b.classList.toggle('active',b.dataset.view===currentView)});
  }catch(e){
    try{console.error('页面渲染失败',e)}catch(_){}
    $('#main').innerHTML='<div class="panel"><p class="muted">页面渲染出现问题，你的数据已保留。请刷新页面重试，或在「数据管理」导出备份。</p></div>';
  }
}
function applySlogan(){
  var el=$('#slogan');
  if(!el)return;
  var v=String(state.settings.slogan||'');
  if(el.textContent!==v) el.textContent=v;
}
function navigate(v){
  if(!VIEWS[v])return;
  currentView=v;render();
  try{window.scrollTo({top:0,behavior:'smooth'})}catch(_){}
}
function bindViewEvents(){
  if(currentView==='practices'){
    var f=$('#f-from'),t=$('#f-to'),c=$('#f-cat');
    if(f)f.onchange=function(){ui.practiceFrom=f.value;render()};
    if(t)t.onchange=function(){ui.practiceTo=t.value;render()};
    if(c)c.onchange=function(){ui.practiceCat=c.value;render()};
  }
  if(currentView==='mantras'){
    var rp=$('#rec-project-filter');
    if(rp)rp.onchange=function(){ui.recitationProject=this.value;render()};
  }
  if(currentView==='quotes'){
    var s=$('#q-search'),tg=$('#q-tag');
    if(s)s.oninput=function(){ui.quoteKw=this.value;var l=$('#quote-list');if(l)l.innerHTML=quoteListHtml(quoteFiltered())};
    if(tg)tg.onchange=function(){ui.quoteTag=this.value;var l=$('#quote-list');if(l)l.innerHTML=quoteListHtml(quoteFiltered())};
  }
}

/* ---------- 表单 ---------- */
function openCategoryForm(id){
  var c=id?find(state.categories,id):null;
  openModal({title:id?'编辑功课类目':'新增功课类目',fields:[
    {name:'name',label:'功课名称',type:'text',value:c?c.name:'',placeholder:'如：皈依与大礼拜、发菩提心…'},
    {name:'target',label:'目标时长（小时，参考）',type:'number',value:c&&safeNum(c.target)?c.target:'',min:0,step:0.5,
      hint:'用于分项卡片显示；全部时长计入 2258 小时总目标'},
    {name:'group',label:'所属分组（可选）',type:'text',value:c?c.group||'':''},
    {name:'note',label:'备注（可选）',type:'text',value:c?c.note:'',full:true}
  ],onSubmit:function(d){
    if(!d.name){toast('请填写功课名称');return false}
    if(state.categories.some(function(x){return x&&x.name===d.name&&x.id!==id})){toast('该类目已存在');return false}
    var target=Math.max(0,safeNum(d.target));
    if(c){
      var old=c.name;
      Object.assign(c,{name:d.name,target:target,group:d.group,note:d.note});
      if(old!==d.name){
        state.practices.forEach(function(p){if(p&&p.name===old)p.name=d.name});
        if(ui.practiceCat===old)ui.practiceCat=d.name;
      }
    }else state.categories.push({id:uid(),name:d.name,target:target,group:d.group,note:d.note});
    save();render();toast(id?'已更新功课类目':'已新增功课类目：'+d.name);
  }});
}

  if(!state.categories.length){toast('功课清单为空，请先补充功课类目');openCategoryForm();return}
  var p=id?find(state.practices,id):null;

    {name:'name',label:'功课名称',type:'select',value:p?p.name:opts[0].value,options:opts},
    {name:'hours',label:'时长（小时）',type:'number',value:p?p.hours:1,min:0,step:0.5},
    {name:'minutes',label:'时长（分钟）',type:'number',value:p?p.minutes:0,min:0,max:59,step:1},
    {name:'date',label:'日期',type:'date',value:p?p.date:today()},
    {name:'note',label:'备注（仪轨、心得等，可选）',type:'textarea',value:p?p.note:'',rows:3,full:true}
  ],onSubmit:function(d){
    var hours=Math.max(0,safeNum(d.hours)),minutes=Math.min(59,Math.max(0,safeNum(d.minutes)));

          Object.assign(r,{mode:m,count:count,note:note});

        }else{

        }

function splitBatch(raw){
  return String(raw||'').split(/[、\n]/).map(function(s){
    return String(s).replace(/\s+/g,' ').trim();
  }).filter(function(s){return s.length>0});
}
function openBatchForm(kind){
  var isBook=kind==='book', isEmp=kind==='emp';
  var label=isBook?'书目':(isEmp?'灌顶':'口传');
  var unit=isBook?'本':'条';
  var labelField=isBook?'书名':'名称';
  var ph=isBook?'例如：入菩萨行论、菩提道次第广论、现观庄严论':(isEmp?'例如：文殊灌顶、金刚萨埵灌顶、上师瑜伽灌顶':'例如：大圆满心性休息、普贤上师言教');
  var restHint=isBook?'作者、阅读顺序、状态、备注先留空，写入后点开卡片逐条补充。':'上师、日期、地点、备注先留空，写入后点开卡片逐条补充。';
  var root=$('#modal-root');
  root.innerHTML='<div class="modal-overlay" data-close-overlay="1"><div class="modal">'+
    '<div class="modal-head"><h3>批量录入'+label+'</h3><button type="button" class="icon-btn" data-close-btn="1">×</button></div>'+
    '<div class="modal-body">'+
      '<div class="field"><label>粘贴'+labelField+'（用「、」分隔）</label>'+
      '<textarea id="batch-text" rows="6" placeholder="'+esc(ph)+'"></textarea>'+
      '<div class="hint">'+restHint+'</div></div>'+
      '<button type="button" class="btn" id="batch-preview-btn">预览拆分</button>'+
      '<div id="batch-preview" class="batch-preview"></div>'+
    '</div>'+
    '<div class="modal-foot"><button type="button" class="btn" data-close-btn="1">取消</button>'+
    '<button type="button" class="btn primary" id="batch-ok" disabled>确认写入</button></div>'+
  '</div></div>';
  var names=[];
  function preview(){
    try{
      names=splitBatch($('#batch-text',root).value);
      var box=$('#batch-preview',root), ok=$('#batch-ok',root);
      if(!names.length){ box.innerHTML='<div class="muted">未识别到有效条目</div>'; ok.disabled=true; ok.textContent='确认写入'; return }
      box.innerHTML='<div class="batch-count">将拆出 <b>'+names.length+'</b> '+unit+labelField+'：</div><ol class="batch-list">'+
        names.map(function(n){return '<li>'+esc(n)+'</li>'}).join('')+'</ol>';
      ok.disabled=false; ok.textContent='确认写入 '+names.length+' '+unit;
    }catch(e){ toast('预览失败，请检查输入') }
  }
  $('#batch-preview-btn',root).onclick=preview;
  $('#batch-text',root).addEventListener('input',function(){ preview() });
  $('#batch-ok',root).onclick=function(){
    if(!names.length){ toast('请先输入并预览'); return }
    confirmDialog({title:'确认批量写入',message:'确认写入 <b>'+names.length+'</b> '+unit+label+'记录？其他字段留空，之后可逐条编辑。',confirmText:'确认写入',onConfirm:function(){
      var ts=new Date().toISOString();
      if(isBook){
        names.forEach(function(n,i){ state.books.push({id:uid(),title:n,author:'',order:state.books.length+1,status:'待读',note:'',createdAt:ts}) });
      }else{
        var arr=isEmp?state.empowerments:state.transmissions;
        names.forEach(function(n){ arr.push({id:uid(),name:n,master:'',date:'',location:'',note:'',createdAt:ts}) });
      }
      save();render();toast('已写入 '+names.length+' '+unit+label+'记录');
    }});
  };
  preview();
  try{ $('#batch-text',root).focus() }catch(e){}
}

function openDetail(kind,id){
  var arr,title,rows,label;
  if(kind==='book'){
    arr=state.books; var b=find(arr,id); if(!b)return; title='书目详情'; label=b.title;
    rows=[['书名',b.title],['作者 / 传承',b.author||'—'],['阅读顺序',safeNum(b.order)||'—'],['状态',b.status||'待读'],['备注',b.note||'—']];
  }else if(kind==='emp'||kind==='trans'){
    arr=kind==='emp'?state.empowerments:state.transmissions; var x=find(arr,id); if(!x)return;
    title=(kind==='emp'?'灌顶':'口传')+'详情'; label=x.name;
    rows=[[kind==='emp'?'灌顶名称':'口传内容名称',x.name],[kind==='emp'?'传承上师':'传法上师',x.master||'—'],['接受日期',x.date||'—'],['地点',x.location||'—'],['备注',x.note||'—']];
  }else if(kind==='quote'){
    arr=state.quotes; var q=find(arr,id); if(!q)return; title='法语详情';
    label=String(q.text||q.quote||'').slice(0,16);
    rows=[['法语正文',q.text||q.quote||''],['出处 / 来源',q.source||'—'],['记录日期',q.date||'—'],['标签 / 分类',q.tag||'—'],['备注（个人体会）',q.note||'—']];
  }else return;
  var actions=[];
  if(kind==='book'&&b.status!=='已读完') actions.push({label:'标记已读完',cls:'btn',fn:function(){
    var it=find(state.books,id); if(it){it.status='已读完';save();closeModal();render();flashProgress();toast('已标记读完：'+it.title)}
  }});
  actions.push({label:'编辑',cls:'btn primary',fn:function(){
    closeModal();
    if(kind==='book')openBookForm(id); else if(kind==='quote')openQuoteForm(id); else openArchiveForm(kind,id);
  }});
  actions.push({label:'删除',cls:'btn danger-ghost',fn:function(){ closeModal(); deleteFrom(arr,id,label) }});
  showDetail(title,detailRows(rows),actions);
}

function deleteFrom(arr,id,label,after){
  var it=find(arr,id);if(!it)return;
  confirmDialog({title:'删除确认',message:'确定删除「'+esc(label)+'」吗？删除后不可恢复。',confirmText:'确认删除',onConfirm:function(){
    var i=arr.indexOf(it);if(i>-1)arr.splice(i,1);
    save();if(after)after();render();toast('已删除：'+label);
  }});
}
function exportData(){
  try{
    var blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});
    var url=URL.createObjectURL(blob),a=document.createElement('a');
    a.href=url;a.download='修行台账备份_'+today()+'.json';
    document.body.appendChild(a);a.click();a.remove();
    setTimeout(function(){URL.revokeObjectURL(url)},1500);
    toast('备份已导出');
  }catch(e){toast('导出失败，请检查浏览器下载权限')}
}
function importData(file){
  if(!file)return;
  var reader=new FileReader();
  reader.onload=function(){
    var d;
    try{d=JSON.parse(reader.result)}catch(e){toast('文件不是有效的 JSON 备份');return}
    if(!d||typeof d!=='object'){toast('备份文件格式无法识别');return}
    confirmDialog({title:'导入确认',message:'导入将覆盖当前全部数据，且不可撤销。建议先导出一份当前备份。确定继续吗？',confirmText:'覆盖导入',onConfirm:function(){
      state=normalizeState(d); save(); applySlogan(); render(); toast('数据已导入');
    }});
  };
  reader.onerror=function(){toast('文件读取失败')};
  reader.readAsText(file);
}

/* ---------- 指令 ---------- */
function runCommand(raw){
  var s=String(raw||'').trim().toLowerCase();
  if(!s)return;
  var has=function(){for(var i=0;i<arguments.length;i++)if(s.indexOf(arguments[i])>=0)return true;return false};
  if(has('法语','法语集','教言')){
    if(has('新增','录入','记录','添加')){navigate('quotes');openQuoteForm();return}
    navigate('quotes');toast('已打开法语集');return;
  }
  if(has('批量录入','批量')){
    if(has('书目','书单','闻思')){navigate('books');openBatchForm('book');return}
    if(has('口传','传承')){navigate('transmissions');openBatchForm('trans');return}
    navigate('empowerments');openBatchForm('emp');return;
  }
  if(has('新增书目','添加书目')){navigate('books');openBookForm();return}
  if(has('录入功课','记录功课','新增功课记录','做功课','加行记录')){navigate('practices');openPracticeForm();return}
  if(has('新增念诵','记录念诵','上报念诵','念诵计数','新增心咒','记录心咒','心咒计数','录入心咒','念咒计数')){navigate('mantras');openRecitationReportForm();return}
  if(has('总进度','总体进度','进度总览','查看进度')){navigate('overview');toast('已切换到总览');return}
  if(has('本月记录','本月','当月记录')){
    navigate('practices');
    var d=new Date(),y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0');
    ui.practiceFrom=y+'-'+m+'-01';
    ui.practiceTo=y+'-'+m+'-'+String(new Date(y,d.getMonth()+1,0)).padStart(2,'0');
    ui.practiceCat='';render();toast('已筛选本月功课记录');return;
  }
  if(has('书目','清单','闻思')){navigate('books');toast('已打开闻思书目');return}
  if(has('灌顶')){navigate('empowerments');toast('已打开灌顶档案');return}
  if(has('口传','传承')){navigate('transmissions');toast('已打开口传档案');return}
  if(has('帮助','说明','怎么用')){openHelp();return}
  toast('未识别指令。可尝试：录入功课 / 上报念诵 / 查看总进度 / 查看本月记录 / 查看书目清单 / 查看法语集');
}
function safeRun(fn){
  try{fn()}catch(e){
    try{console.error('操作失败',e)}catch(_){}
    toast('操作未能完成，请重试');
  }
}

/* ---------- 事件 ---------- */
$('#sidebar').addEventListener('click',function(e){
  var b=e.target.closest('.nav-item');if(b)safeRun(function(){navigate(b.dataset.view)});
});
$('#main').addEventListener('click',function(e){
  var b=e.target.closest('[data-action]');if(!b)return;
  var a=b.dataset.action,id=b.dataset.id;
  safeRun(function(){
    switch(a){
      case 'nav':navigate(b.dataset.view);break;
      case 'export':exportData();break;
      case 'import':triggerImport();break;
      case 'add-cat':openCategoryForm();break;
      case 'edit-cat':openCategoryForm(id);break;
      case 'del-cat':
        var c=find(state.categories,id);if(!c)break;
        if(categoryHours(c.name)>0){toast('该类目已有功课记录，请先处理记录后再删除类目');break}
        deleteFrom(state.categories,id,c.name);break;
      case 'add-practice':openPracticeForm();break;
      case 'edit-practice':openPracticeForm(id);break;
      case 'del-practice':
        var p=find(state.practices,id);if(p)deleteFrom(state.practices,id,p.name+' '+fmtHours(p));break;
      case 'add-rec-project':openRecitationProjectForm();break;
      case 'edit-rec-project':openRecitationProjectForm(id);break;
      case 'del-rec-project':
        var rp=find(state.recitationProjects,id);
        if(!rp)break;
        if(rp.id===LEGACY_RECITATION_ID){toast('默认项目受保护，不能删除');break}
        var recCount=projectRecords(rp).length;
        confirmDialog({title:'删除念诵项目',
          message:'确定删除「'+esc(rp.name)+'」吗？'+(recCount?'该项目下的 <b>'+recCount+'</b> 条上报记录也会一并删除；':'')+'此操作不可恢复。',
          confirmText:'确认删除',requireText:rp.name,
          onConfirm:function(){
            state.mantras=state.mantras.filter(function(r){return !r||r.projectId!==id});
            var i=state.recitationProjects.indexOf(rp);if(i>-1)state.recitationProjects.splice(i,1);
            if(ui.recitationProject===id)ui.recitationProject='';
            save();render();toast('已删除念诵项目：'+rp.name);
          }});
        break;
      case 'add-rec':openRecitationReportForm();break;
      case 'edit-rec':openRecitationReportForm(id);break;
      case 'del-rec':
        var rr=find(state.mantras,id);
        if(rr){var rrp=projectOfRecord(rr);deleteFrom(state.mantras,id,(rrp&&rrp.name||'念诵')+' · '+fmt(rr.count)+' '+(rrp&&rrp.unit||'遍'))}
        break;
      case 'set-target-date':
        var dv=$('#target-date').value;
        state.settings.mantraTargetDate=dv;save();render();toast(dv?'已保存目标完成日期':'已清除目标完成日期');break;
      case 'add-book':openBookForm();break;
      case 'batch-book':openBatchForm('book');break;
      case 'detail-book':openDetail('book',id);break;
      case 'finish-book':
        var bk=find(state.books,id);if(bk){bk.status='已读完';save();render();flashProgress();toast('已标记读完：'+bk.title)}break;
      case 'del-book':
        var b2=find(state.books,id);if(b2)deleteFrom(state.books,id,b2.title);break;
      case 'add-emp':openArchiveForm('emp');break;
      case 'batch-emp':openBatchForm('emp');break;
      case 'detail-emp':openDetail('emp',id);break;
      case 'del-emp':
        var em=find(state.empowerments,id);if(em)deleteFrom(state.empowerments,id,em.name);break;
      case 'add-trans':openArchiveForm('trans');break;
      case 'batch-trans':openBatchForm('trans');break;
      case 'detail-trans':openDetail('trans',id);break;
      case 'del-trans':
        var tr=find(state.transmissions,id);if(tr)deleteFrom(state.transmissions,id,tr.name);break;
      case 'add-quote':openQuoteForm();break;
      case 'edit-quote':openQuoteForm(id);break;
      case 'detail-quote':openDetail('quote',id);break;
      case 'del-quote':
        var qt=find(state.quotes,id);if(qt)deleteFrom(state.quotes,id,String(qt.text||qt.quote||'').slice(0,16));break;
      case 'filter-month':
        var d=new Date(),y=d.getFullYear(),mm=String(d.getMonth()+1).padStart(2,'0');
        ui.practiceFrom=y+'-'+mm+'-01';
        ui.practiceTo=y+'-'+mm+'-'+String(new Date(y,d.getMonth()+1,0)).padStart(2,'0');
        render();break;
      case 'filter-clear':ui.practiceFrom='';ui.practiceTo='';ui.practiceCat='';render();break;
    }
  });
});
/* 只匹配事件目标自身，避免点击弹窗内部输入框时向上命中遮罩而关闭弹窗 */
document.addEventListener('click',function(e){
  var t=e.target;
  if(!t||typeof t.matches!=='function')return;
  try{
    if(t.matches('[data-close-overlay]')||t.matches('[data-close-btn]'))closeModal();
  }catch(_){}
});
$('#btn-help').onclick=function(){safeRun(openHelp)};
$('#btn-data').onclick=function(){safeRun(openDataPanel)};
$('#cmd-go').onclick=function(){safeRun(function(){runCommand($('#cmd-input').value)}) ;$('#cmd-input').value=''};
$('#cmd-input').addEventListener('keydown',function(e){
  if(e.key==='Enter'){safeRun(function(){runCommand(e.target.value)});e.target.value=''}
});
$('#cmd-toggle').addEventListener('click',function(){
  var panel=$('#cmd-panel');
  if(!panel)return;
  var willOpen=panel.hasAttribute('hidden');
  if(willOpen){panel.removeAttribute('hidden');this.setAttribute('aria-expanded','true')}
  else{panel.setAttribute('hidden','');this.setAttribute('aria-expanded','false')}
});
$('#import-file').addEventListener('change',function(e){
  importData(e.target.files&&e.target.files[0]);
  e.target.value='';
});
/* 顶部 slogan：点击即可编辑，输入自动保存到本地 */
(function(){
  var el=$('#slogan');
  if(!el)return;
  applySlogan();
  el.addEventListener('input',function(){ state.settings.slogan=this.textContent.replace(/\n/g,''); save() });
  el.addEventListener('keydown',function(e){ if(e.key==='Enter'){ e.preventDefault(); this.blur() } });
})();

applySlogan();
render();
initIDB();
})();

</script>
